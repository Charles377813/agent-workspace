name: tests

# 每次 push／PR 跑 hrms-leave-agent 的自動測試；不需要 API 金鑰（不呼叫真實 LLM）
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      # demo_worker.py 的行程終止在 Windows 與 POSIX 走不同分支，兩邊都跑、各自回報
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/hrms-leave-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/hrms-leave-agent/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run tests
        run: python -m pytest -q
